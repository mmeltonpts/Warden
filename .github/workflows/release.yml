name: Release

# Push a version tag to release:
#   git tag v0.1.0 && git push origin v0.1.0
# Tests run, the image is published to ghcr.io/<owner>/warden as :0.1.0, :0.1 and :latest,
# and a GitHub Release is created with notes generated from the commits since the last tag.
# Versions below 1.0.0 are marked pre-release.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  id-token: write # keyless image signing (cosign / Sigstore)

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx vitest run
      - run: npx tsc --noEmit
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/warden
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WARDEN_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scan the published image by digest. ignore-unfixed so a vuln with no patch yet does not
      # block a release; a FIXABLE critical does, which is the signal worth stopping for.
      - name: Scan the published image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/warden@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # Keyless (Sigstore) signature over the digest, so an adopter can verify the image is the
      # one this repo's release built: `cosign verify ghcr.io/<owner>/warden@<digest>
      # --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image
        run: cosign sign --yes "ghcr.io/${{ github.repository_owner }}/warden@${{ steps.build.outputs.digest }}"

      # Software bill of materials, attached to the GitHub Release below.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/warden@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: warden-sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: warden-sbom.spdx.json

  release:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbom
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/warden
        run: |
          PRE=""
          [[ "$TAG" == v0.* || "$TAG" == *-* ]] && PRE="--prerelease"
          cat > notes.md <<EOF
          ## Install

          **On a VM** (Ubuntu 24.04):
          \`\`\`bash
          git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git warden && cd warden
          sudo ./deploy/install.sh
          \`\`\`

          **With Docker:**
          \`\`\`bash
          git clone --branch ${TAG} https://github.com/${GITHUB_REPOSITORY}.git warden && cd warden
          ./docker/init.sh && docker compose up -d
          \`\`\`
          Image: \`${IMAGE}:${TAG#v}\`

          See the README for the full walkthrough.
          EOF
          gh release create "$TAG" --title "Warden ${TAG}" --notes-file notes.md --generate-notes $PRE \
            warden-sbom.spdx.json
