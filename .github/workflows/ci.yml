name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx vitest run
      - run: npx tsc --noEmit
      - name: Shell scripts parse
        run: for f in deploy/*.sh docker/*.sh; do bash -n "$f"; done
      # A real gate, not the manual pre-release audit SECURITY.md used to rely on. Critical-only
      # so the accepted build-tooling advisories (documented in SECURITY.md) do not block, but a
      # critical advisory in a production dependency fails the build.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  # Builds the image exactly as a release would, without publishing it, so a broken
  # Dockerfile is found on main rather than on release day.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: warden:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
